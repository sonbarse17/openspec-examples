name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  staging:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: staging
      image_tag: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: production   # required reviewers gate this
      image_tag: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
